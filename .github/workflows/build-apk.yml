name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk tkp-collector.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tkp-collector-apk
          path: tkp-collector.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TKP Collector build ${{ github.run_number }}
          body: "APK dari commit ${{ github.sha }}. Link tetap ke versi terbaru: https://github.com/${{ github.repository }}/releases/latest/download/tkp-collector.apk"
          files: tkp-collector.apk
          make_latest: true
